name: Build and Send Release APK to Telegram & Verify iOS

_on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # ================= РАБОТА 1: ТЕСТЫ, СБОРКА И ОТПРАВКА ANDROID (LINUX) =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP Common Tests
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run Quality Checks for Release
        run: ./gradlew :app:compileReleaseSources

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Send APK to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: 706399730
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "Релизная сборка Android готова и подписана! Все общие тесты пройдены успешно."
          document: ${{ steps.sign_app.outputs.signedReleaseFile }}

   # ================= РАБОТА 2: ЖИВОЙ ЗАПУСК И ЛОГИРОВАНИЕ IOS (MACOS) =================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Запускаем приложение на симуляторе напрямую силами Kotlin/Gradle
      - name: Run App on iOS Simulator and Print Logs
        run: |
          echo "==== Запуск iOS симулятора через Gradle ===="
          
          # Эта таска сама создаст симулятор iPhone, запустит приложение и выведет println() в консоль
          ./gradlew :shared:iosSimulatorArm64Test --info
